<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= device-width, initial-scale= 1.0">
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<a href= "index.html">
      <img id = "TrangChuIcon" src = "Home.png" height="50" width="50" alt= "Trang chủ"></img>
</a>
    <h1 id = "MessageForUser"> Đăng ký sản phẩm</h1>
    <div class="Information">
        <div class = "userInformation"> 
                <div>
         <h2> Thông tin người bán</h2>
         <label> Họ và Tên: </label>
         <input required type="name" name = "Tên" id ="username" maxlength="50" placeholder="Nhập họ và tên của bạn">
         </div> <br>
      <div>
        <label>Trường: </label>
        <input required type="text" name="Trường" id = "schoolName" placeholder="Nhập tên trường bạn đang học ">
      </div> <br>
    <div>
        <label>Số điện thoại(Zalo):</label>
        <input required type="tel" name="Số điện thoại" id ="phoneNumber" placeholder="Nhập số điện thoại">
    </div> <br>
    <div>
        <label>Link tài khoản Facebook: </label>
        <input required type="url" name="facebook" id ="facebookAccount" placeholder="Điền link tài khoản facebook">
    </div> <br>
        <label>Thẻ học sinh(bắt buộc): </label>
        <input required type="file" name="imageCard" id ="ImageCard" accept="image/*">
    </div> <br>
    
        </div> <!-- -------------Đóng div class của UserInformation---------------->

        <!-- Phần html của thông tin sản phẩm-->
        <div class = "ProductIn4">
                 <div>
         <h2> Thông tin sản phẩm đăng ký</h2>
         <label> Tên sản phẩm </label>
         <input required type="name" name = "TênSp" id ="ProductName" maxlength="100" placeholder="Điền tên sản phẩm">
         </div> <br>
      <div>
        <label>Mô tả sản phẩm: </label>
        <input required type="text" name="Describe" id = "ProductDetail" placeholder="Nhập chi tiết thông tin sản phẩm">
      </div> <br>
    <div>
        <label>Giá bán:</label>
        <input required type="number" name="PriceTag" id ="PriceTag" placeholder="Giá bán sản phẩm">
    </div> <br>
    <div>
        <label>Hình ảnh sản phẩm: </label>
        <input required type="file" name="imageProduct" id ="ProductImage" accept="image/*">
    </div> <br>
         
        </div> <!-- Đóng div class của Thông tin sản phẩm-->
            
        </div> <!-- Đóng div class của Information -->

    <div id = "submitIn4"> <button type="button">Đăng ký sản phẩm</button></div>

</body>

    <!--------------------------------- Phần script, tao làm luôn trên html cho nhanh------------------------->
<!--khai ở head r nha Diệp nên k cần khai nữa> <!--thêm thư viện nha-->
<script type="module">
    const supabaseUrl = "https://rsndakviombsnwebuegy.supabase.co" // Url của supabase
    const supabaseAnonKey = "sb_publishable_jLDAR7Kpb6W65lgmvpVSMA_9shoqFxk" // Key của supabase
    
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey); 
    const submitButton = document.getElementById("submitIn4")
    // Insert dữ liệu vào table của 
    submitButton.addEventListener("click", async(e)=>{
        e.preventDefault();
        const MessageAfterProduct = document.getElementById("MessageForUser") // Xíu nữa đăng nhập thành công sẽ đổi thành "Đăng nhập thành công"
        const userName= document.getElementById("username").value 
        const schoolName = document.getElementById("schoolName").value 
        const phoneNumber = document.getElementById("phoneNumber").value 
        const linkFacebook= document.getElementById("facebookAccount").value
        // Khai báo biến cho Sản phẩm data (dạng text)
        const ProductName= document.getElementById("ProductName").value 
        const ProductDetail = document.getElementById("ProductDetail").value 
        const ProductPrice = document.getElementById("PriceTag").value 
        
        // Khai báo biến cho Sản phẩm data (dạng file)
        const cardImg= document.getElementById("ImageCard").files[0]; 
        const ProductImg= document.getElementById("ProductImage").files[0]; 
        const ext = cardImg.name.split('.').pop();
        const filePath = `${Date.now()}.${ext}`; 
        
        
        //------------------ Phần lưu vào storage (Hình ảnh người dùng cung cấp)----------------------
        const {data:dataImgSTC,error: errorSTC} = await supabaseClient.storage
        .from ("student_Card")
        .upload (filePath,cardImg,{
            cacheControl: '3600', 
            upsert: false, 
            contentType: cardImg.type
        }); 

        
        // --------Phần Insert biến trên vào supabase table-----------------
         const { data, error } = await supabaseClient
        .from("ProductSignUp") // Đây là tên table, nó sẽ xác định là nhập vào bảng table nào trong supabase
        .insert([ //class insert này sẽ để nó chuyển thông tin vào table của mình
            {
            // -----------Phần data của người dùng---------------
            user_name: userName, //user_name là key (tên của column trong table bên supabase )
            user_school:schoolName, 
            user_ZaloTel: phoneNumber,
            user_FacebookLink: linkFacebook, 
            // ----------- Phần data của product-----------------
            product_Name: ProductName, 
            product_Price: ProductPrice , 
            product_Detail: ProductDetail
            }
         ])     
        .select() // hàm này giúp mình tự thêm ID cho phần đăng ký đó
        if(error){
            alert("Đăng ký thất bại do "+ error.message)       // nếu gửi data thất bại
            return ; 
        }
            MessageAfterProduct.textContent= "Đăng ký sản phẩm thành công"; 
            window.location.href="PhanDangKyThanhCong.html"; // Tự chuyển đến html file này, trang này tao sẽ để kiểu như xác thực sản phẩm trong 24h
    });    
</script>

</html>
